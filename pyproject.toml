[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant1x-num"
version = "0.0.0"
description = "Python spec of the quant1x num library (num/ package, see docs/proposals/0003)"
requires-python = ">=3.11"

# Python spec 按 NumPy 命名空间组织在 num/（提案 0003）。
[tool.setuptools.packages.find]
include = ["num*"]
